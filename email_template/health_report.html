<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;padding:24px;background:#f1f5f9;font-family:Segoe UI,Arial,sans-serif;color:#0f172a;">
  <div style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:16px;padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.08);">
    <h1 style="margin:0 0 4px;font-size:22px;color:#0f172a;">Health Summary Report</h1>
    <p style="margin:0 0 20px;color:#64748b;font-size:13px;">{{REPORT_DATE}}</p>

    <table width="100%" cellspacing="10" cellpadding="0" style="border-collapse:separate;">
      <tr>
        <td style="background:#f1f5f9;border-radius:12px;padding:16px;text-align:center;">
          <div style="font-size:12px;color:#64748b;">Steps</div>
          <div style="font-size:20px;font-weight:700;color:#0f172a;">{{STEPS}}</div>
        </td>
        <td style="background:#f1f5f9;border-radius:12px;padding:16px;text-align:center;">
          <div style="font-size:12px;color:#64748b;">Sleep (h)</div>
          <div style="font-size:20px;font-weight:700;color:#0f172a;">{{SLEEP}}</div>
        </td>
      </tr>
      <tr>
        <td style="background:#f1f5f9;border-radius:12px;padding:16px;text-align:center;">
          <div style="font-size:12px;color:#64748b;">Avg Heart Rate</div>
          <div style="font-size:20px;font-weight:700;color:#0f172a;">{{HEART_RATE}}</div>
        </td>
        <td style="background:#f1f5f9;border-radius:12px;padding:16px;text-align:center;">
          <div style="font-size:12px;color:#64748b;">Calories</div>
          <div style="font-size:20px;font-weight:700;color:#0f172a;">{{CALORIES}}</div>
        </td>
      </tr>
    </table>

    <h2 style="margin:24px 0 8px;font-size:15px;color:#0f172a;">Notes</h2>
    <p style="font-size:13px;color:#334155;line-height:1.6;margin:0;">{{NOTES}}</p>

    <h2 style="margin:24px 0 8px;font-size:15px;color:#0f172a;">Recommendation</h2>
    <p style="font-size:13px;color:#334155;line-height:1.6;margin:0;">{{RECOMMENDATION}}</p>

    <p style="margin:24px 0 0;font-size:12px;color:#94a3b8;">Generated by Ciel.</p>
  </div>
</body></html>
