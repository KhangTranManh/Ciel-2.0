<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title></head>
<body style="margin:0;padding:24px;background:#0f172a;font-family:Segoe UI,Arial,sans-serif;color:#e2e8f0;">
  <div style="max-width:640px;margin:0 auto;background:#1e293b;border-radius:16px;padding:28px;">
    <h1 style="margin:0 0 4px;font-size:22px;color:#f8fafc;">{{TITLE}}</h1>
    <p style="margin:0 0 8px;color:#94a3b8;font-size:13px;">{{DATE}} &mdash; {{SOURCE_TYPE}}</p>
    <p style="margin:0 0 20px;color:#64748b;font-size:12px;">Source: {{SOURCE_LABEL}}</p>

    <h2 style="margin:20px 0 8px;font-size:15px;color:#f8fafc;">Summary</h2>
    <p style="font-size:14px;color:#cbd5e1;line-height:1.6;margin:0;">{{SUMMARY}}</p>

    <h2 style="margin:24px 0 8px;font-size:15px;color:#f8fafc;">Key points</h2>
    <div style="background:#0f172a;border-radius:12px;padding:16px;font-size:13px;color:#cbd5e1;line-height:1.55;">
      {{KEY_POINTS}}
    </div>

    <h2 style="margin:24px 0 8px;font-size:15px;color:#f8fafc;">Risks / caveats</h2>
    <div style="background:#0f172a;border-radius:12px;padding:16px;font-size:13px;color:#cbd5e1;line-height:1.55;">
      {{RISKS}}
    </div>

    <h2 style="margin:24px 0 8px;font-size:15px;color:#f8fafc;">Actions</h2>
    <div style="background:#0f172a;border-radius:12px;padding:16px;font-size:13px;color:#cbd5e1;line-height:1.55;">
      {{ACTIONS}}
    </div>

    <h2 style="margin:24px 0 8px;font-size:15px;color:#f8fafc;">Quotes / markers</h2>
    <div style="background:#0f172a;border-radius:12px;padding:16px;font-size:13px;color:#94a3b8;font-family:Consolas,monospace;line-height:1.5;white-space:pre-wrap;">{{QUOTES}}</div>

    <p style="margin:24px 0 0;font-size:12px;color:#64748b;">Generated by Ciel &mdash; facts from the source file only.</p>
  </div>
</body></html>
