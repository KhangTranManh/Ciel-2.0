name: Ciel Health Check

# Tầng 1 — lightweight daily health check (see scripts/health_check.py). Deliberately
# NOT the full backtest suite (backtest/test_hard_special.py etc.) — that suite sends
# REAL emails and burns 40-60 LLM calls per run; running it on a daily cron would be
# expensive and spammy. This workflow boots CielCore and makes exactly ONE real Brain
# LLM call to prove the system is alive, then reports PASS/FAIL to Telegram.

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 Vietnam (UTC+7)
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # NOT 3.10: pandas-ta 0.4.71b0 (in requirements.txt) requires Python >=3.12
          # and has no distribution compatible with 3.10 on PyPI at all ("from
          # versions: none") — found live via a real CI run. 3.13 matches the local
          # dev venv this project is actually developed/tested against.
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gmail is OPTIONAL for this check (search_gmail isn't tested here, only that
      # ToolManager can load the skill pack). Only written if the secrets are actually
      # set — writing an empty/garbage file would turn a clean "not configured" skip
      # into a real, confusing error inside gmail_ops.py.
      #
      # NOTE: the conditional lives INSIDE the shell step (bash `[ -n ... ]`), not in
      # a step-level `if: secrets.X != ''`. Referencing `secrets` directly in an `if:`
      # expression is a common source of GitHub Actions parse errors ("Unrecognized
      # named-value: 'secrets'") — passing it through `env:` and testing it in bash
      # sidesteps that entirely and is the standard, portable pattern.
      - name: Decode Gmail credentials (optional)
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_B64" ]; then
            echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > credentials.json
            mkdir -p ciel_data
            if [ -n "$GOOGLE_TOKEN_B64" ]; then
              echo "$GOOGLE_TOKEN_B64" | base64 -d > ciel_data/gmail_token.json
            fi
          else
            echo "Gmail credentials not configured on this repo — skipping (expected unless you added GOOGLE_CREDENTIALS_B64)."
          fi

      - name: Run health check
        env:
          # --- Providers (set whichever ones your .env actually uses) ---
          BRAIN_PROVIDER: ${{ vars.BRAIN_PROVIDER || 'vilao' }}
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL || 'alic/qwen3.7-max' }}
          WORKER_PROVIDER: ${{ vars.WORKER_PROVIDER || 'deepseek' }}
          CODER_MODEL: ${{ vars.CODER_MODEL || 'deepseek-chat' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VILAO_URL: ${{ secrets.VILAO_URL }}
          VILAO_KEY: ${{ secrets.VILAO_KEY }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GPT_BASE_URL: ${{ secrets.GPT_BASE_URL }}
          # --- Safety (content-filter permissiveness only — this workflow never
          # executes a tool, so the destructive-action gate is never touched) ---
          SAFETY_OPEN: 'true'
          VILAO_SAFETY_BYPASS: 'true'
          # --- Trading / Telegram (all optional; check just reports if missing) ---
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.health_check

      - name: Upload thoughts.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ciel-health-check-log
          path: ciel_data/logs/thoughts.log
          if-no-files-found: ignore
