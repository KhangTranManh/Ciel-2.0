name: Ciel Health Check

# Tầng 1 — lightweight daily health check (see scripts/health_check.py). Deliberately
# NOT the full backtest suite (backtest/test_hard_special.py etc.) — that suite sends
# REAL emails and burns 40-60 LLM calls per run; running it on a daily cron would be
# expensive and spammy. This workflow builds the SAME image docker/docker-compose.api.yml
# deploys, runs scripts/health_check.py inside it (boots CielCore, makes exactly ONE
# real Brain LLM call), and reports PASS/FAIL to Telegram.
#
# Runs inside the real Docker image (not a bare `pip install` on the runner) so this
# also doubles as a daily proof that docker/Dockerfile + requirements-docker.txt still
# build correctly — the two checks used to be separate; now one run covers both.
# This used to run bare on the runner with stale BRAIN_PROVIDER=vilao/GPT_API_KEY vars
# left over from before the project switched to a single `custom` OpenAI-compatible
# provider (2026-07-27) — that's why it kept reporting "alive" against a model/provider
# no longer in use, and eventually failed with Vilao's 402 INSUFFICIENT_BALANCE. Fixed
# here to match the real .env shape (API_KEY/BASE_URL, BRAIN_PROVIDER=custom).
#
# Second job step (scripts/daily_digest.py) reuses the SAME already-built image to ask
# Ciel — through real Brain routing, not a hand-rolled call — for a Gmail + news
# summary, then reports it to Telegram. Only runs if the health check passed (a dead
# provider shouldn't also produce a broken/empty digest attempt).

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 Vietnam (UTC+7)
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ciel image
        run: docker build -f docker/Dockerfile -t ciel-health-check .

      # Same directory scripts/health_check.py's own comments assume: gitignored,
      # absent on a fresh checkout, so CielCore's bootup-cleanse check (which only
      # fires on a STALE memory_bank.json) never triggers here — no volume needed for
      # that. Mounted anyway so thoughts.log survives the container for the
      # upload-on-failure step below (the container itself is removed after --rm).
      - name: Prepare state dir
        run: mkdir -p ciel_data/logs

      # Gmail is OPTIONAL for this check (search_gmail isn't tested here, only that
      # ToolManager can load the skill pack). Only written if the secrets are actually
      # set — writing an empty/garbage file would turn a clean "not configured" skip
      # into a real, confusing error inside gmail_ops.py.
      - name: Decode Gmail credentials (optional)
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_B64" ]; then
            echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > credentials.json
            if [ -n "$GOOGLE_TOKEN_B64" ]; then
              echo "$GOOGLE_TOKEN_B64" | base64 -d > ciel_data/gmail_token.json
            fi
          else
            echo "Gmail credentials not configured on this repo — skipping (expected unless you added GOOGLE_CREDENTIALS_B64)."
            touch credentials.json   # empty file, never mounted unless it exists (see run step)
          fi

      - name: Run health check inside the container
        env:
          # --- Providers — must match .env's real shape: one custom OpenAI-compatible
          # endpoint for every tier (see agent_system/config.py's API_KEY/BASE_URL note) ---
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL || 'gpt-5.6-sol' }}
          CODER_MODEL: ${{ vars.CODER_MODEL || 'gpt-5.6-luna' }}
          MIDDLEWARE_MODEL: ${{ vars.MIDDLEWARE_MODEL || 'gpt-5.5' }}
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          # --- Safety (content-filter permissiveness only — this workflow never
          # executes a tool, so the destructive-action gate is never touched) ---
          SAFETY_OPEN: 'true'
          VILAO_SAFETY_BYPASS: 'true'
          # --- Trading / Telegram (all optional; check just reports if missing) ---
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          docker run --rm \
            --name ciel-health-check \
            -e BRAIN_PROVIDER=custom \
            -e BRAIN_MODEL \
            -e WORKER_PROVIDER=custom \
            -e CODER_MODEL \
            -e MIDDLEWARE_ENABLED=true \
            -e MIDDLEWARE_PROVIDER=custom \
            -e MIDDLEWARE_MODEL \
            -e API_KEY \
            -e BASE_URL \
            -e SAFETY_OPEN \
            -e VILAO_SAFETY_BYPASS \
            -e DISABLE_SAFETY_GATE=false \
            -e DISABLED_SKILL_MODULES=vision_ops \
            -e TWELVEDATA_API_KEY \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -v "$PWD/ciel_data:/app/ciel_data" \
            -v "$PWD/credentials.json:/app/credentials.json:ro" \
            ciel-health-check \
            python -m scripts.health_check

      - name: Upload thoughts.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ciel-health-check-log
          path: ciel_data/logs/thoughts.log
          if-no-files-found: ignore

      # Runs only if the health check step above succeeded (default GitHub Actions
      # behavior — no explicit `if:` needed). Reuses the exact same image; no rebuild.
      - name: Daily digest (email + news) via Telegram
        env:
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL || 'gpt-5.6-sol' }}
          CODER_MODEL: ${{ vars.CODER_MODEL || 'gpt-5.6-luna' }}
          MIDDLEWARE_MODEL: ${{ vars.MIDDLEWARE_MODEL || 'gpt-5.5' }}
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          docker run --rm \
            --name ciel-daily-digest \
            -e BRAIN_PROVIDER=custom \
            -e BRAIN_MODEL \
            -e WORKER_PROVIDER=custom \
            -e CODER_MODEL \
            -e MIDDLEWARE_ENABLED=true \
            -e MIDDLEWARE_PROVIDER=custom \
            -e MIDDLEWARE_MODEL \
            -e API_KEY \
            -e BASE_URL \
            -e SAFETY_OPEN=true \
            -e VILAO_SAFETY_BYPASS=true \
            -e DISABLE_SAFETY_GATE=false \
            -e DISABLED_SKILL_MODULES=vision_ops \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -v "$PWD/ciel_data:/app/ciel_data" \
            -v "$PWD/credentials.json:/app/credentials.json:ro" \
            ciel-health-check \
            python -m scripts.daily_digest
