services:
  ciel-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ciel-api
    restart: unless-stopped
    ports:
      - "${CIEL_PORT:-8000}:8000"
    env_file:
      - ../.env
    volumes:
      # Persistent runtime state — facts.json, chat memory, vector_memory,
      # gmail_token.json, thoughts.log, task/deferred stores. Without this the
      # container starts clean (and forgets everything) on every rebuild.
      - ../ciel_data:/app/ciel_data
      # Files Ciel writes for/reads from the Master (reports, generated docs).
      - ../agent_output:/app/agent_output
      - ../ciel_workspace:/app/ciel_workspace
      # Google OAuth client secret — gitignored, must exist on the host before
      # `docker compose up` (see credentials.json.example if you need the shape).
      - ../credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
